<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touchline</title>
<style>
  :root { --bg:#0f1a14; --panel:#17261d; --line:#2a4033; --text:#e6efe9; --dim:#8fa698; --accent:#5fd38d; --warn:#f0b35a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; color:var(--accent); letter-spacing:.5px; }
  h2 { font-size:17px; margin:20px 0 8px; }
  #info { color:var(--dim); flex:1; min-width:200px; }
  main { max-width:900px; margin:0 auto; padding:0 16px 40px; }
  button, select { font:inherit; color:var(--text); background:#21382b; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on, button.primary { background:var(--accent); color:#06140c; border-color:var(--accent); font-weight:600; }
  button.link { background:none; border:0; padding:0; text-align:left; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr.me td { background:#1f3a2a; font-weight:600; }
  tr.sel td { background:#2f5540; }
  .oop { color:var(--warn); }
  .msg { color:var(--warn); min-height:1.4em; margin:8px 0; }
  .dim { color:var(--dim); }
  .score { font-size:22px; font-weight:700; margin:8px 0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  td select { padding:3px 6px; }
  .attrs { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:4px 16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin:12px 0; }
  .attrs h3 { grid-column:1/-1; margin:8px 0 2px; font-size:13px; color:var(--dim); font-weight:500; }
  .attrs div { display:flex; justify-content:space-between; }
  .attrs b.hi { color:var(--accent); }
  #info { display:flex; align-items:center; gap:8px; }
  .grid button { display:flex; align-items:center; gap:8px; text-align:left; }
  .crest, .kit { vertical-align:middle; flex:none; }
  td .crest { margin-right:6px; }
  .club { display:flex; align-items:center; gap:16px; margin:12px 0; }
  .club b { font-size:18px; }
  .fixture { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .live { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .feed { max-height:460px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .feed .goal { color:var(--accent); font-weight:600; }
  table.stats { width:auto; min-width:280px; }
  table.stats td:nth-child(2) { text-align:center; color:var(--dim); }
  @media (max-width:700px) { .live { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>Touchline</h1><span id="info"></span><nav id="nav" class="bar" style="margin:0"></nav></header>
<main id="main"></main>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
