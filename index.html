<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17261d">
<meta name="description" content="Football management in the English leagues.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Touchline</title>
<style>
  /* colour and type tokens: every colour in the UI comes from here */
  :root { --bg:#0f1a14; --panel:#17261d; --panel-2:#21382b; --line:#2a4033; --text:#e6efe9; --dim:#8fa698; --accent:#5fd38d; --warn:#f0b35a; --danger:#e0605a;
    --pitch:#2a6b3e; --chalk:#f4f1e6; --me:#1f3a2a; --sel:#2f5540; --fit:#24382d; --on-accent:#06140c; --shadow:#0008;
    --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-family:var(--font-display); font-size:20px; color:var(--accent); letter-spacing:.5px; }
  h2 { font-family:var(--font-display); font-size:17px; margin:20px 0 8px; }
  #info { color:var(--dim); flex:1; min-width:0; }
  main { max-width:900px; margin:0 auto; padding:0 16px 40px; }
  button, select { font:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on, button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  button.link { background:none; border:0; padding:0; text-align:left; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr.me td { background:var(--me); font-weight:600; }
  tr.up td:first-child, .key.up { border-left:4px solid var(--accent); }
  tr.playoff td:first-child, .key.playoff { border-left:4px solid var(--warn); }
  tr.down td:first-child, .key.down { border-left:4px solid var(--danger); }
  .key { display:inline-block; width:0; height:12px; margin:0 4px 0 10px; vertical-align:middle; }
  td.win { font-weight:600; color:var(--accent); }
  tr.sel td { background:var(--sel); }
  tr.fits td { background:var(--fit); }
  .oop { color:var(--warn); }
  .msg { color:var(--warn); min-height:1.4em; margin:8px 0; }
  .dim { color:var(--dim); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  td select { padding:3px 6px; }
  .attrs { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:4px 16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin:12px 0; }
  .attrs h3 { grid-column:1/-1; margin:8px 0 2px; font-size:13px; color:var(--dim); font-weight:500; }
  .attrs p { grid-column:1/-1; margin:4px 0 8px; }
  .attrs div { display:flex; justify-content:space-between; }
  .attrs b.hi { color:var(--accent); }
  #info { display:flex; align-items:center; gap:8px; }
  .grid button { display:flex; align-items:center; gap:8px; text-align:left; }
  .crest, .kit { vertical-align:middle; flex:none; }
  td .crest { margin-right:6px; }
  .club { display:flex; align-items:center; gap:16px; margin:12px 0; }
  .club b { font-size:18px; }
  .fixture { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .live { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .live > * { min-width:0; }
  .feed { max-height:460px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .feed .goal { color:var(--accent); font-weight:700; font-size:1.1em; padding:4px 0; }
  .feed .big { font-weight:600; }
  .feed .sent { color:var(--warn); }
  .feed .mine { border-left:3px solid var(--accent); padding-left:6px; }
  tr.out td { opacity:.55; text-decoration:line-through; }
  tr.out td .oop { text-decoration:none; display:inline-block; }
  table.stats { width:auto; min-width:280px; }
  table.stats td:nth-child(2) { text-align:center; color:var(--dim); }
  @media (max-width:700px) { .live { grid-template-columns:1fr; } }
  header { padding-top:max(12px, env(safe-area-inset-top)); }
  /* header: sticky, one scrolling tab strip, game actions behind a menu */
  header { position:sticky; top:0; z-index:5; display:block; padding-bottom:0; }
  header .top { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  #info { flex-wrap:wrap; gap:4px 8px; }
  #info b { color:var(--text); font-weight:600; }
  .chip { background:var(--panel-2); border:1px solid var(--line); border-radius:99px; padding:1px 8px; font-size:13px; white-space:nowrap; }
  #menu { position:relative; }
  #menu summary { list-style:none; cursor:pointer; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  #menu summary::-webkit-details-marker { display:none; }
  #sys { position:absolute; right:0; top:calc(100% + 4px); display:flex; flex-direction:column; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; min-width:150px; box-shadow:0 8px 24px var(--shadow); }
  nav { display:flex; overflow-x:auto; scrollbar-width:none; margin:8px -16px 0; padding:0 12px; }
  nav::-webkit-scrollbar { display:none; }
  nav button { background:none; border:0; border-bottom:3px solid transparent; border-radius:0; padding:8px 10px; color:var(--dim); white-space:nowrap; }
  nav button.on { background:none; color:var(--text); border-bottom-color:var(--accent); }
  nav button:hover { color:var(--text); }
  /* controls */
  input[type=number], input[type=text] { font:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  :is(button, select, input, summary):focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  td button:not(.link), td input[type=number] { padding:2px 8px; font-size:13px; }
  @media (max-width:700px) { header h1 { display:none; } .scoreboard .big { font-size:28px; } }
  /* rules text, folded away until wanted */
  details.help { margin:6px 0 12px; color:var(--dim); }
  details.help summary { cursor:pointer; font-size:13px; width:max-content; }
  details.help p { margin:6px 0 0; max-width:70ch; }
  table.narrow { width:auto; min-width:280px; }
  /* scoreboard: match screen, live match, report */
  .scoreboard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 12px; margin:12px 0; text-align:center; }
  .scoreboard > div { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .scoreboard b { font-size:15px; }
  .scoreboard .big { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .scoreboard .sub { font-size:13px; color:var(--dim); }
  /* player profile */
  .attrs .ph { grid-column:1/-1; justify-content:flex-start; flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .attrs .ph .pname { font-size:19px; color:var(--text); }
  .attrs .ph [data-act=close] { margin-left:auto; }
  .attrs h3 { text-transform:uppercase; letter-spacing:.06em; font-size:11px; }
  #update { position:fixed; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:10; box-shadow:0 4px 16px var(--shadow); }
</style>
</head>
<body>
<header><div class="top"><h1>Touchline</h1><span id="info"></span><details id="menu"><summary>Menu</summary><div id="sys"></div></details></div><nav id="nav"></nav></header>
<main id="main"></main>
<script type="module" src="src/ui/app.js"></script>
<script type="module" src="src/ui/pwa.js"></script>
</body>
</html>
